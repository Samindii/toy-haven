<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toy Haven - Shopping Cart</title>

    <meta name="description" content="View your Toy Haven shopping cart">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <a href="index.html" class="logo">
                Toy Haven
            </a>

            <button class="menu-toggle" id="menuToggle">
                ☰
            </button>

            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="wishlist.html">Wishlist</a></li>
                <li><a href="feedback.html">Feedback</a></li>
            </ul>

        </nav>
    </header>


    <main>

        <section class="page-header">
            <h1>Shopping Cart</h1>
            <p>Review the products you have selected.</p>
        </section>


        <section class="cart-section">

            <div id="cartItems" class="cart-items">
            </div>


            <div class="cart-summary">

                <h2>Cart Summary</h2>

                <p>
                    Total:
                    <strong id="cartTotal">LKR.0.00</strong>
                </p>

                <button id="clearCart" class="btn">
                    Clear Cart
                </button>

                <a href="checkout.html" class="btn">
                    Proceed to Checkout
                </a>

            </div>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 Toy Haven. All rights reserved.</p>

        <div>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="feedback.html">Support</a>
        </div>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
