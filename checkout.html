<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toy Haven - Checkout</title>

    <meta name="description" content="Complete your Toy Haven order">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <a href="index.html" class="logo">
                Toy Haven
            </a>

            <button class="menu-toggle" id="menuToggle">
                ☰
            </button>

            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="wishlist.html">Wishlist</a></li>
                <li><a href="feedback.html">Feedback</a></li>
            </ul>

        </nav>
    </header>


    <main>

        <section class="page-header">
            <h1>Checkout</h1>
            <p>Complete your order details below.</p>
        </section>


        <section class="checkout-section">

            <div class="order-summary">

                <h2>Order Summary</h2>

                <div id="checkoutItems">
                </div>

                <h3>
                    Total:
                    <span id="checkoutTotal">$0.00</span>
                </h3>

            </div>


            <div class="checkout-form-container">

                <h2>Delivery Details</h2>

                <form id="checkoutForm">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        required
                    >


                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >


                    <label for="address">
                        Delivery Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        rows="4"
                        required
                    ></textarea>


                    <label for="paymentMethod">
                        Payment Method
                    </label>

                    <select
                        id="paymentMethod"
                        name="paymentMethod"
                        required
                    >

                        <option value="">
                            Select Payment Method
                        </option>

                        <option value="Card">
                            Card
                        </option>

                        <option value="Cash on Delivery">
                            Cash on Delivery
                        </option>

                    </select>


                    <button
                        type="submit"
                        class="btn"
                    >
                        Place Order
                    </button>

                </form>


                <div
                    id="successMessage"
                    class="success-message"
                    style="display: none;"
                >
                </div>

            </div>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 Toy Haven. All rights reserved.</p>

        <div>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="feedback.html">Support</a>
        </div>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
